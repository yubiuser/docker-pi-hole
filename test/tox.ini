[tox]
envlist = py3

[testenv:py3]
allowlist_externals = docker
deps = -rrequirements.txt
passenv = PLATFORM
setenv =
    COLUMNS=120
    PY_COLORS=1 
commands =  # Build the Docker image for testing depending on the architecture
            docker buildx build --load --platform={env:PLATFORM:linux/amd64} --progress plain -f ../src/Dockerfile -t pihole:CI_container ../src/
            # run the tests
            pytest {posargs:-vv -n auto} ./tests/